<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cocina · Borgorosso</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/operacion.css">
</head>
<body class="op op--personal">
  <header class="per-cabecera">
    <h1>Cocina</h1>
    <button type="button" class="per-boton per-boton--lleno" id="coc-sonido" aria-pressed="false">Activar sonido</button>
  </header>
  <main class="coc-columnas">
    <section class="coc-columna coc-columna--confirmar"><h2>Por confirmar <span id="n-por_confirmar">0</span></h2><div id="col-por_confirmar"></div></section>
    <section class="coc-columna"><h2>Aceptados <span id="n-nuevo">0</span></h2><div id="col-nuevo"></div></section>
    <section class="coc-columna"><h2>En preparación <span id="n-preparando">0</span></h2><div id="col-preparando"></div></section>
    <section class="coc-columna"><h2>Listos para servir <span id="n-listo">0</span></h2><div id="col-listo"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/pedidos-store.js"></script>
  <script src="js/pedidos-supabase.js"></script>
  <script src="js/acceso-personal.js"></script>
  <script src="js/cocina.js"></script>
</body>
</html>
